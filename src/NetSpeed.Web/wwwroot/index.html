<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rastreamento Correios</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --texto: #1c2330; --suave: #5b6577; --borda: #dfe3ea;
    --marca: #0b57d0; --ok: #0a7d3e; --erro: #b3261e; --aviso: #8a5a00;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171c; --card: #1d222b; --texto: #e6e9ef; --suave: #98a2b3; --borda: #2c3340;
            --marca: #7aa7ff; --ok: #5fd08a; --erro: #ff8a80; --aviso: #ffd27a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--texto); font: 15px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { color: var(--suave); margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--borda); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  textarea { width: 100%; min-height: 84px; font: inherit; padding: 10px; border: 1px solid var(--borda);
             border-radius: 8px; background: var(--bg); color: var(--texto); resize: vertical; }
  button { font: inherit; background: var(--marca); color: #fff; border: 0; border-radius: 8px; padding: 9px 18px; cursor: pointer; }
  button:disabled { opacity: .55; cursor: progress; }
  .dica { color: var(--suave); font-size: 13px; margin-top: 6px; }
  .st { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 12px; border: 1px solid var(--borda); }
  .st.ok { color: var(--ok); } .st.erro { color: var(--erro); } .st.aviso { color: var(--aviso); }
  ol.eventos { list-style: none; margin: 12px 0 0; padding: 0; border-left: 2px solid var(--borda); }
  ol.eventos li { padding: 0 0 14px 16px; position: relative; }
  ol.eventos li::before { content: ""; position: absolute; left: -6px; top: 6px; width: 10px; height: 10px;
                          border-radius: 50%; background: var(--marca); }
  .quando { color: var(--suave); font-size: 13px; }
  .titulo { font-weight: 600; }
  details { margin-top: 10px; } summary { cursor: pointer; color: var(--suave); }
  pre { background: var(--bg); padding: 12px; border-radius: 8px; overflow: auto; font-size: 12.5px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; } td, th { padding: 4px 8px; border-bottom: 1px solid var(--borda); text-align: left; }
</style>
</head>
<body>
<main>
  <h1>Rastreamento Correios</h1>
  <p class="sub">Consulta automatizada (com resolução automática do CAPTCHA). Um código por linha.</p>

  <div class="card">
    <label for="codigos"><b>Códigos de rastreamento</b></label>
    <textarea id="codigos" placeholder="NN437873753BR"></textarea>
    <div class="dica">Cada consulta abre um navegador e o portal limita requisições; a fila roda uma por vez, então pode levar alguns segundos por código.</div>
    <p><button id="consultar">Consultar</button> <span id="status" class="dica"></span></p>
  </div>

  <div id="resultados"></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

$("consultar").addEventListener("click", async () => {
  const codigos = $("codigos").value.split(/[\s,;]+/).filter(Boolean);
  if (!codigos.length) { $("status").textContent = "Informe ao menos um código."; return; }

  $("consultar").disabled = true;
  $("resultados").innerHTML = "";
  $("status").textContent = "Enfileirando...";

  try {
    const r = await fetch("/api/rastreamentos", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ codigos })
    });
    const corpo = await r.json();
    if (!r.ok) { $("status").textContent = corpo.erro ?? "Falha ao enfileirar."; return; }
    await acompanhar(corpo.id);
  } catch (e) {
    $("status").textContent = "Erro: " + e.message;
  } finally {
    $("consultar").disabled = false;
  }
});

async function acompanhar(id) {
  for (;;) {
    const job = await (await fetch("/api/rastreamentos/" + id)).json();
    $("status").textContent = "Situação: " + job.status.toLowerCase() + "…";
    if (job.status === "concluido" || job.status === "falhou") {
      $("status").textContent = job.status === "concluido" ? "Concluído." : "Falhou: " + (job.mensagemDeFalha ?? "");
      $("resultados").innerHTML = job.resultados.map(cartao).join("");
      return;
    }
    await new Promise(r => setTimeout(r, 1500));
  }
}

function cartao(r) {
  const tent = r.tentativasCaptcha ?? [];
  const cabecalho = `<b>${esc(r.codigoObjeto)}</b> ` +
    (r.sucesso ? `<span class="st ok">sucesso</span>` : `<span class="st erro">${esc(r.erro?.codigo)}</span>`) +
    ` <span class="quando">${r.duracaoMs} ms · ${tent.length} tentativa(s) de CAPTCHA</span>`;

  const corpo = r.sucesso
    ? `<ol class="eventos">${r.eventos.map(e => `
        <li><div class="titulo">${esc(e.status)}</div>
            ${e.descricao ? `<div>${esc(e.descricao)}</div>` : ""}
            ${e.local ? `<div>${esc(e.local)}</div>` : ""}
            ${e.origem ? `<div>de ${esc(e.origem)}</div>` : ""}
            ${e.destino ? `<div>para ${esc(e.destino)}</div>` : ""}
            <div class="quando">${esc(e.dataHoraOriginal ?? "")}</div></li>`).join("")}</ol>`
    : `<p class="st erro">${esc(r.erro?.mensagem)}</p>`;

  const tabela = tent.length
    ? `<details><summary>Tentativas do CAPTCHA</summary><table><tr><th>#</th><th>Leitura</th><th>Aceito</th><th>ms</th><th>Obs.</th></tr>${
        tent.map(t => `<tr><td>${t.numero}</td><td>${esc(t.texto)}</td><td>${t.aceito ? "sim" : "não"}</td><td>${t.duracaoMs}</td><td>${esc(t.observacao)}</td></tr>`).join("")
      }</table></details>` : "";

  return `<div class="card">${cabecalho}${corpo}${tabela}<details><summary>JSON</summary><pre>${esc(JSON.stringify(r, null, 2))}</pre></details></div>`;
}
</script>
</body>
</html>
